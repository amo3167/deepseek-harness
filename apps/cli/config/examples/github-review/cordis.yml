# Opt-in overlay: signed GitHub webhook ingress for automatic code review.
#
# Mounts the generic webhook runtime, the dedicated code-review rule
# (`@deepseek-ai/dsh-webhook-code-review`), and a second loopback WebServer
# that exposes only `POST /github`. Compose with the base Web bundle; the rule
# reviews the working tree of the mapped local checkout. See the `dsh-webhook`
# and `dsh-webhook-github` READMEs for signing, credential, and isolation
# details.
#
# Environment:
#   DSH_GITHUB_WEBHOOK_SECRET    required — the shared signing secret
#   DSH_GITHUB_WEBHOOK_PORT      optional — ingress port (default 3081)
#   DSH_GITHUB_REVIEW_WORKSPACE  optional — checkout to review
#                                (default the host's current directory)
- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: github-ready-review-rule
      name: '@deepseek-ai/dsh-webhook-code-review'
      config:
        source: primary-github
        events: [pull_request]
        pullRequestActions: [ready_for_review]
        workspaces:
          deepseek-harness/deepseek-harness: !!js process.env.DSH_GITHUB_REVIEW_WORKSPACE ?? process.cwd()
        agentPreset: standard
        permissionPreset: read-only

    - id: github-webhook-ingress
      name: cordis:group
      group: true
      isolate:
        webServer: true
      config:
        - id: github-webhook-host
          name: '@deepseek-ai/dsh-host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js Number(process.env.DSH_GITHUB_WEBHOOK_PORT || 3081)

        - id: github-webhook-route
          name: '@deepseek-ai/dsh-webhook-github'
          config:
            source: primary-github
            path: /github
            secretEnv: DSH_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
